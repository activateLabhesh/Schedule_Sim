[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osscheduler"
version = "0.1.0"
description = "CPU scheduling simulator with starvation and aging analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "reportlab>=4.2", "rich>=13.9"]

[project.scripts]
osscheduler = "osscheduler.cli:main"

[tool.setuptools.packages.find]
include = ["osscheduler*"]

[tool.setuptools.package-data]
"osscheduler.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
